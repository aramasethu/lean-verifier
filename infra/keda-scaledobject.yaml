apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: verifier-scaler
  namespace: default
spec:
  scaleTargetRef:
    name: verifier
  pollingInterval: 5
  cooldownPeriod: 60
  minReplicaCount: 1
  maxReplicaCount: 5
  triggers:
    - type: redis
      metadata:
        address: redis.default.svc.cluster.local:6379
        listName: verify_queue
        listLength: "5"
