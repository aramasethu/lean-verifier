apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
  labels:
    app: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference
  template:
    metadata:
      labels:
        app: inference
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: inference
          image: inference:v1
          imagePullPolicy: Never
          env:
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: N_ATTEMPTS
              value: "4"
            - name: MAX_NEW_TOKENS
              value: "64"
            - name: TEMPERATURE
              value: "0.8"
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 3Gi
